# Dzienny przyrost pomocy publicznej z SUDOP.
#
# Jedno zapytanie na dobe obejmuje CALY kraj (zmierzone 18.09.2026: 3 531
# przypadkow z 1 150 gmin zmiescilo sie w jednej stronie odpowiedzi).
# Dlatego ten przebieg nie obciaza urzedu bardziej niz jeden czlowiek
# klikajacy raz dziennie w wyszukiwarce.
#
# CO ROBI: pobiera DWA dni i zostawia surowe odpowiedzi jako artefakt:
#  - wczoraj — swiezy, NIEPELNY (urzedy maja 7 dni na zgloszenie pomocy;
#    zmierzone: czwartek pobrany dzien pozniej mial 200 przypadkow, czwartki
#    pobrane po 3-4 tygodniach — 5 657 i 7 850),
#  - dzien sprzed 14 dni — odswiezony, juz USTALONY. Dopiero ten wchodzi
#    do sum na stronach (src/lib/dane.ts, DNI_DO_USTALENIA).
# Dwa zapytania na dobe.
# CZEGO NIE ROBI: nie zapisuje niczego do repozytorium — odpowiedzi zawieraja
# dane osobowe, a repozytorium moze byc publiczne. Import do bazy robi sie
# na komputerze: `npm run sudop:artefakty`, a potem `--przyrost=...`.
#
# UWAGA: w publicznym repozytorium GitHub po cichu wylacza harmonogram po
# 60 dniach bez aktywnosci. Jesli przebiegi znikna — wejdz w zakladke Actions
# i wlacz go z powrotem.
name: SUDOP — przyrost dzienny

on:
  schedule:
    # 01:17 UTC, poza pelna godzina. ZMIERZONE 18.09.2026: przebieg zaplanowany
    # na 04:17 GitHub uruchomil o 09:00 UTC, a kolejka UOKiK w godzinach pracy
    # urzedu czekala 54 min (w nocy 2-9 min). Wczesniejsza godzina daje zapas
    # na opoznienie GitHuba.
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      zakres:
        description: 'Zakres dni RRRR-MM-DD..RRRR-MM-DD (puste = wczoraj)'
        required: false
        default: ''

jobs:
  pobierz:
    runs-on: ubuntu-latest
    # Dwa pobrania, kazde moze czekac w kolejce do 62 min.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Ustal zakresy dni
        id: zakres
        run: |
          if [ -n "${{ inputs.zakres }}" ]; then
            echo "swiezy=${{ inputs.zakres }}" >> "$GITHUB_OUTPUT"
            echo "ustalany=" >> "$GITHUB_OUTPUT"
          else
            D=$(date -u -d 'yesterday' +%F)
            U=$(date -u -d '14 days ago' +%F)
            echo "swiezy=$D..$D" >> "$GITHUB_OUTPUT"
            echo "ustalany=$U..$U" >> "$GITHUB_OUTPUT"
          fi

      - name: Pobierz swiezy dzien
        run: npx tsx ingest/jobs/sudop.ts --przyrost=${{ steps.zakres.outputs.swiezy }} --tylko-pobierz

      - name: Odswiez dzien sprzed 14 dni
        if: steps.zakres.outputs.ustalany != ''
        run: npx tsx ingest/jobs/sudop.ts --przyrost=${{ steps.zakres.outputs.ustalany }} --tylko-pobierz --odswiez

      - name: Spakuj odpowiedzi
        run: gzip -9 dane/zrodla/sudop/przyrost-*.json

      - uses: actions/upload-artifact@v4
        with:
          name: sudop-${{ steps.zakres.outputs.swiezy }}
          path: dane/zrodla/sudop/przyrost-*.json.gz
          # 90 dni to maksimum dla repozytorium publicznego. Prywatne moze miec
          # 400 — jesli repozytorium jest prywatne, podnies te liczbe.
          retention-days: 90
          if-no-files-found: error
