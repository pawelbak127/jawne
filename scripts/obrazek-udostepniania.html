<!doctype html>
<!--
  Obrazek podgladu linku (Open Graph, 1200x630) -> src/app/opengraph-image.png.
  Renderowany Chrome'em, bo tekst z polskimi znakami potrzebuje prawdziwych
  fontow (sharp/librsvg wzialby to, co akurat jest w systemie):

  chrome --headless=new --hide-scrollbars --window-size=1200,630 \
    --virtual-time-budget=8000 --user-data-dir=<pusty katalog> \
    --screenshot=src/app/opengraph-image.png scripts/obrazek-udostepniania.html

  Fonty i barwy jak w serwisie: Brygada 1918 (naglowek), Public Sans (tekst),
  --akcent #1d70b8, --atrament #0b0c0c. Znak „z” jak w scripts/ikony.mjs.
-->
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@600&family=Public+Sans:wght@400;600&display=block&subset=latin-ext" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  body { font-family: 'Public Sans', sans-serif; color: #0b0c0c; display: flex; flex-direction: column; }
  .pas { height: 18px; background: #1d70b8; }
  .tresc { flex: 1; display: flex; align-items: center; gap: 56px; padding: 0 80px; }
  svg { width: 220px; height: 220px; flex: none; }
  h1 { font-family: 'Brygada 1918', Georgia, serif; font-weight: 600; font-size: 112px; line-height: 1; margin: 0 0 22px; letter-spacing: -1px; }
  p { margin: 0; font-size: 36px; line-height: 1.3; }
  .stopka { display: flex; justify-content: space-between; align-items: baseline; padding: 0 80px 44px; font-size: 27px; color: #484949; }
  .stopka b { color: #1d70b8; font-weight: 600; }
</style>
</head>
<body>
  <div class="pas"></div>
  <div class="tresc">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#1d70b8"/><path d="M17 16H47V23L27 41H47V48H17V41L37 23H17Z" fill="#fff"/></svg>
    <div>
      <h1>zrejestru</h1>
      <p>Sejm i pieniądze publiczne — z rejestrów, liczba po liczbie</p>
    </div>
  </div>
  <div class="stopka">
    <span>posłowie · głosowania · ustawy · gminy · pomoc publiczna · zamówienia</span>
    <b>zrejestru.pl</b>
  </div>
</body>
</html>
